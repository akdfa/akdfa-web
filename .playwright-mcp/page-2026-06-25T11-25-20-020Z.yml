    - generic [ref=e62]:
      - paragraph [ref=e63]: About AKDFA / Who We Are
      - heading "United by passion. Driven by purpose." [level=2] [ref=e64]
      - paragraph [ref=e65]: Founded with a passion for celebrating sporting excellence, our association proudly holds the distinction of being the world's first registered fans association dedicated to a sports player. Built on the values of unity, loyalty, and sportsmanship, we bring together thousands of fans who share a common admiration for one of the greatest icons in sports.
      - paragraph [ref=e66]: Over the years, our association has grown into a vibrant community that goes beyond fandom, engaging in social initiatives, charitable activities, sports promotion programs, and community development efforts. Through our collective spirit, we aim to inspire the next generation while honoring the legacy of the player who unites us all.
      - paragraph [ref=e67]: More than just a fan club, we are a family connected by passion, respect, and a commitment to making a positive impact on society.
